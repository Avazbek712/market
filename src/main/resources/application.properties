spring.application.name=ownProject
# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/minimarket}
spring.datasource.username=${DB_USERNAME:minimarket}
spring.datasource.password=${DB_PASSWORD:minimarket}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate - schema is owned by Liquibase, Hibernate only validates it against the DB
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JWT
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-prod-minimum-32-chars-long}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}