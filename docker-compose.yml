services:
  postgres:
    image: postgres:16
    container_name: minimarket-postgres
    environment:
      POSTGRES_DB: minimarket
      POSTGRES_USER: minimarket
      POSTGRES_PASSWORD: minimarket
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: minimarket-redis
    ports:
      - "6379:6379"
  kafka:
    image: apache/kafka:4.3.1
    container_name: minimarket-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minimarket-minio
    ports:
      - "9000:9000"   # S3 API — сюда будет стучаться Spring Boot
      - "9001:9001"   # веб-консоль — смотреть бакеты глазами
    environment:
      MINIO_ROOT_USER: minimarket
      MINIO_ROOT_PASSWORD: minimarket123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
volumes:
  postgres-data:
  kafka-data:
  minio-data:

